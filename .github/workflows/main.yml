name: Auto Green

on:
  schedule:
    - cron: '0 17 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate random content
        run: |
          echo "Update $(date) $RANDOM" >> log.txt

      - name: Commit and Push
        run: |
          git config user.name "JiaShuqi08"
          git config user.email "jia1shu2qi3@163.com"

          git add .

          git commit -m "daily update $(date +'%Y-%m-%d %H:%M:%S')" 

          git push
